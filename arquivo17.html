<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>ARQUIVO 17 — Investigação</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020307;color:#eef2f7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}body{overflow:hidden}.hidden{display:none!important}
#game{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#101a2b 0,#04060a 42%,#010205 100%)}
#phone{width:min(430px,100vw);height:min(900px,100vh);position:relative;overflow:hidden;background:#070a10;border:1px solid #1c2432;box-shadow:0 30px 100px #000;border-radius:34px}
#phone:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 45%,rgba(255,255,255,.025) 50%,transparent 55%);mix-blend-mode:screen}
#status{height:30px;position:absolute;z-index:50;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:8px 18px;font-size:11px;color:#cbd3df;background:linear-gradient(#05070c,transparent)}
#status #clock{margin-right:auto}
#screen{height:100%;overflow:auto;padding-bottom:55px;scrollbar-width:none}#screen::-webkit-scrollbar{display:none}
#nav{position:absolute;z-index:60;bottom:0;left:0;right:0;height:54px;background:rgba(7,9,14,.88);backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #1a2230}#nav button{background:none;font-size:22px;color:#8e9aad}
.lock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:radial-gradient(circle at 50% 25%,#182337,#070a10 55%,#020307)}
.lock .time{font-size:70px;letter-spacing:-4px;font-weight:200}.date{color:#9ca8b8}.case-title{font-size:12px;letter-spacing:5px;color:#77859b;margin-bottom:12px}.glitch{font-weight:800;letter-spacing:3px;text-shadow:2px 0 #8c1322,-2px 0 #274a72}.lock .notify{margin-top:55px;width:min(340px,100%);background:#111722dd;border:1px solid #263042;border-radius:17px;padding:14px;text-align:left;animation:pulse 3s infinite}.lock .notify b{font-size:12px}.lock .notify p{margin:6px 0 0;color:#c8d0dc}.swipe{margin-top:28px;color:#647185;font-size:12px}
.start{height:100%;padding:35px 26px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 20% 10%,#17243b,#070a10 52%,#030408)}.start h1{font-size:48px;line-height:.95;margin:0 0 12px;letter-spacing:-2px}.start .tag{color:#8995a8;letter-spacing:2px;font-size:11px}.menu{margin-top:50px;display:grid;gap:10px}.primary,.secondary{padding:16px;border-radius:14px;text-align:left}.primary{background:#d9e1eb;color:#080b11;font-weight:800}.secondary{background:#111722;border:1px solid #273244;color:#aeb8c8}
.home{min-height:100%;padding:55px 18px 20px;background:linear-gradient(160deg,#090e17,#05070b)}.homehead{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.homehead .time{font-size:36px;font-weight:300}.homehead small{color:#778397}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}.app{background:none;text-align:center;color:#d9e0ea}.icon{width:52px;height:52px;margin:auto;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#182335,#0d121c);border:1px solid #263145;font-size:23px;box-shadow:0 7px 20px #0008}.app span{display:block;font-size:10px;margin-top:6px;color:#8e9aac}.widget{margin:24px 0;background:#0e141e;border:1px solid #1d2736;border-radius:18px;padding:16px}.widget b{font-size:12px}.widget p{margin:7px 0;color:#a9b4c5;font-size:13px}
.page{min-height:100%;padding:52px 16px 25px;background:#080c13}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.top button{background:#111824;border:1px solid #202c3e;border-radius:11px;padding:8px 12px}.top h2{font-size:18px;margin:0}.card{background:#0d131d;border:1px solid #1d2838;border-radius:16px;padding:14px;margin:10px 0}.muted{color:#7e8b9f;font-size:12px}.row{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#18263a;border:1px solid #2b3a50;font-weight:800}.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}.bubble{max-width:84%;padding:11px 13px;border-radius:16px;background:#111a27;color:#dbe2ec;line-height:1.4;font-size:13px;animation:up .25s}.bubble.me{align-self:flex-end;background:#203957}.bubble .name{font-size:10px;color:#71829b;margin-bottom:4px}.typing{color:#68758a;font-size:12px;font-style:italic;padding:5px 10px}.choices{display:grid;gap:8px;margin-top:12px}.choices button{padding:12px;border-radius:13px;background:#101824;border:1px solid #27364b;text-align:left;color:#cdd7e4}.choices button:hover{background:#172334;border-color:#45617f}
.list{display:grid;gap:8px}.list button{width:100%;background:#0e141e;border:1px solid #1d2838;border-radius:14px;padding:13px;text-align:left}.badge{float:right;color:#78889f}.clue{border-left:3px solid #9b1f32}.red{color:#e56b7c}.green{color:#7ed3a0}.mono{font-family:ui-monospace,SFMono-Regular,monospace}.photo{height:170px;border-radius:15px;background:radial-gradient(circle at 70% 30%,#354760,#111722 45%,#05070b);display:grid;place-items:center;color:#8795a8;letter-spacing:2px;margin:10px 0}.call{height:100%;padding:90px 25px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(circle,#17243a,#05070b 65%)}.call .bigavatar{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:#152238;border:1px solid #32455e;font-size:36px}.call .caller{margin:20px 0 5px;font-size:22px}.call .number{color:#7e8da1;font-size:12px}.call .timer{font-family:monospace;font-size:28px;margin:25px}.call-actions{display:flex;gap:15px}.call-actions button{width:120px;padding:14px;border-radius:15px;background:#121a27;border:1px solid #29384d}.danger{border-color:#73303d!important;color:#ff8898!important}.credits{height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:30px;background:#000}.credits h2{font-size:32px}.credits p{color:#8994a5;line-height:1.7}.end{font-size:13px;color:#d4d9e1;margin-top:40px}.shake{animation:shake .45s}.flash{animation:flash .6s}
#toast{position:fixed;z-index:100;left:50%;top:45px;transform:translateX(-50%) translateY(-20px);opacity:0;background:#111a27;border:1px solid #2c3a4d;border-radius:14px;padding:11px 14px;max-width:min(390px,92vw);font-size:12px;transition:.3s;pointer-events:none}.toast-on{opacity:1!important;transform:translateX(-50%) translateY(0)!important}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 0 5px #7e182520}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes flash{50%{filter:brightness(2)}}@media(max-width:450px){#phone{border-radius:0;border:0}.start h1{font-size:42px}}

</style>
</head>
<body>
<div id="toast"></div>
<div id="game">
  <div id="phone">
    <div id="status"><span id="clock">23:17</span><span>⌁</span><span>⌁</span><span>▰</span></div>
    <div id="screen"></div>
    <div id="nav"><button onclick="home()">⌂</button><button onclick="back()">‹</button><button onclick="toggleSound()">◉</button></div>
  </div>
</div>
<script>
const S=JSON.parse(localStorage.getItem("arquivo17-save")||"null")||{chapter:1,clues:[],choices:{},contactsUnlocked:["Noah"],sound:true,ending:null,first:false,group:false,clock:0};
const people={Noah:{age:19,initial:"N",number:"(21) 98841-2736",bio:"Amigo próximo de Lívia. Reservado. Parece saber mais do que diz."},Helena:{age:19,initial:"H",number:"(21) 99632-8417",bio:"Melhor amiga de Lívia. Emocional e evasiva."},Caio:{age:20,initial:"C",number:"(21) 98154-2098",bio:"Conhecia Lívia há anos. Brincalhão, mas muda quando o assunto é a noite do desaparecimento."},Miguel:{age:21,initial:"M",number:"(21) 99713-6402",bio:"Entende de tecnologia e recuperação de arquivos."},Sofia:{age:18,initial:"S",number:"(21) 98220-7315",bio:"Desconfiada de Noah. Guarda capturas que ninguém mais viu."},Daniel:{age:22,initial:"D",number:"(21) 97510-4418",bio:"Trabalha à noite e conhece o lugar ligado ao caso."}};
const clues={
1:["Pista #01 — 17","O número aparece no primeiro contato de Noah e no horário 23:17."],
2:["Pista #02 — O celular","Lívia deixou o aparelho para trás, mas o aparelho continua enviando dados."],
3:["Pista #03 — A fotografia","No fundo da foto existe uma porta marcada com o mesmo símbolo."],
4:["Pista #04 — 03:17","Um registro apagado aponta para 03:17 na noite do desaparecimento."],
5:["Pista #05 — 17","A sequência 17-03-21-17 abre uma nota escondida."],
6:["Pista #06 — A voz","A gravação de 17 segundos contém uma voz que pede para não confiar em Noah."],
7:["Pista #07 — O endereço","Uma coordenada leva a uma casa abandonada próxima ao antigo observatório."],
8:["Pista #08 — Arquivo corrompido","Miguel recupera um vídeo fragmentado: Lívia estava investigando o próprio grupo."],
9:["Pista #09 — O silêncio","As mentiras dos personagens se encaixam: cada um escondeu uma parte daquela noite."],
10:["Pista #10 — ARQUIVO 17","O arquivo não é uma pessoa. É um protocolo criado para registrar quem procura a verdade."]};
function save(){localStorage.setItem("arquivo17-save",JSON.stringify(S))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("toast-on");setTimeout(()=>x.classList.remove("toast-on"),2400)}
function beep(type="click"){if(!S.sound)return; try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=type==="notify"?520:type==="call"?220:330;o.type="sine";g.gain.value=.025;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}
function nowTime(){let mins=23*60+17+S.clock;let h=Math.floor((mins/60)%24),m=mins%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`}
function tick(){document.getElementById("clock").textContent=nowTime();const l=document.querySelector(".lock .time");if(l)l.textContent=nowTime()}
setInterval(()=>{S.clock++;tick();save()},1000);tick();

function render(v){document.getElementById("screen").innerHTML=v;document.getElementById("screen").scrollTop=0}
function home(){beep();render(`<div class="home"><div class="homehead"><div><div class="time">${nowTime()}</div><small>19 DE SETEMBRO • SÁBADO</small></div><div>▰ 87%</div></div><div class="widget"><b>NOTIFICAÇÃO</b><p>${S.first?"ARQUIVO 17 — novas atividades detectadas.":"Nenhuma atividade recente."}</p></div><div class="apps">
${app("💬","Mensagens","messages()")}${app("👥","Contatos","contacts()")}${app("📞","Telefone","phone()")}${app("🔎","Investigação","investigation()")}
${app("🖼️","Galeria","gallery()")}${app("📂","Arquivos","files()")}${app("📝","Notas","notes()")}${app("🌐","Navegador","browser()")}
${app("👥","Grupo","group()")}${app("⚙️","Ajustes","settings()")}
</div></div>`)}
function app(i,n,f){return `<button class="app" onclick="${f}"><div class="icon">${i}</div><span>${n}</span></button>`}
function lock(){render(`<div class="lock"><div class="case-title">ARQUIVO 17</div><div class="time">${nowTime()}</div><div class="date">19 DE SETEMBRO • SÁBADO</div><div class="notify"><b>NÚMERO DESCONHECIDO</b><p>Giovanna?</p></div><div class="swipe">toque para desbloquear</div><button class="primary" style="margin-top:22px" onclick="home()">DESBLOQUEAR</button></div>`)}
function start(){render(`<div class="start"><div class="tag">CASO // 17</div><h1 class="glitch">ARQUIVO<br>17</h1><p style="color:#a2adbd">UM CASO QUE NUNCA DEVERIA TER SIDO ABERTO.</p><div class="menu"><button class="primary" onclick="begin()">INICIAR INVESTIGAÇÃO</button><button class="secondary" onclick="S.first?home():toast('Nenhum progresso encontrado.')">CONTINUAR</button><button class="secondary" onclick="settings()">CONFIGURAÇÕES</button></div></div>`)}
function begin(){S.first=true;S.chapter=1;S.clock=0;save();beep("notify");chat("Noah",0)}
function top(t){return `<div class="top"><button onclick="home()">‹</button><h2>${t}</h2></div>`}
function messages(){render(`<div class="page">${top("Mensagens")}<div class="list">${S.contactsUnlocked.map(n=>`<button onclick="chat('${n}',0)"><div class="row"><div class="avatar">${people[n].initial}</div><div><b>${n}</b><div class="muted">${people[n].bio.slice(0,45)}…</div></div></div></button>`).join("")}<button onclick="chat('Desconhecido',0)"><div class="row"><div class="avatar">?</div><div><b>Número desconhecido</b><div class="muted">Última mensagem: você não deveria estar falando com Noah.</div></div></div></button></div></div>`)}
function chat(name,step=0){
if(name==="Desconhecido"){render(`<div class="page">${top("Número desconhecido")}<div class="chat"><div class="bubble"><div class="name">DESCONHECIDO • 23:21</div>Você não deveria estar falando com Noah.</div><div class="bubble"><div class="name">DESCONHECIDO</div>Mas agora que começou… não pare.</div></div></div>`);return}
let arr=[];
if(name==="Noah"){arr=[["Noah","Giovanna?"],["Noah","Se você recebeu isso, significa que eu não consegui voltar."],["Noah","Lívia Moraes desapareceu há alguns dias."],["Noah","Ela deixou o celular para trás. Só que o celular começou a enviar mensagens sozinho."],["Noah","Não conte a ninguém que está investigando."]]}
if(name==="Helena"){arr=[["Helena","Você é a Giovanna, né?"],["Helena","Noah falou com você?"],["Helena","Não quero que você se meta nisso."],["Helena","Lívia estava assustada antes de sumir."]]}
if(name==="Caio"){arr=[["Caio","Então você é a investigadora agora? kkk"],["Caio","Olha, eu não vi nada naquela noite."],["Caio","Só não pergunta sobre 03:17."]]}
if(name==="Miguel"){arr=[["Miguel","Noah me pediu para olhar um arquivo."],["Miguel","Tem alguma coisa apagada do celular da Lívia."],["Miguel","Preciso de uma senha: 17-03-21-17."]]}
if(name==="Sofia"){arr=[["Sofia","Eu não confio no Noah."],["Sofia","Se ele te disse que queria ajudar, cuidado."],["Sofia","Tenho uma captura que pode mudar tudo."]]}
const visible=Math.min(arr.length,step+1);
render(`<div class="page">${top(name)}<div class="row" style="margin-bottom:15px"><div class="avatar">${people[name].initial}</div><div><b>${name}</b><div class="muted">${people[name].age} anos • ${people[name].number}</div></div></div><div class="chat">${arr.slice(0,visible).map(x=>`<div class="bubble"><div class="name">${x[0].toUpperCase()}</div>${x[1]}</div>`).join("")}</div>
${visible<arr.length?`<div class="typing">digitando…</div><button class="primary" onclick="beep('notify');chat('${name}',${step+1});advance('${name}',${step})">Continuar</button>`:`<div class="choices">${choices(name)}</div>`}</div>`);
}
function choices(name){
if(name==="Noah")return `<button onclick="choice('trust',1);unlock('Helena');chapter(2)">[ O que aconteceu com Lívia? ]</button><button onclick="choice('trust',0);unlock('Sofia');chapter(2)">[ Como conseguiu meu número? ]</button>`;
if(name==="Helena")return `<button onclick="choice('helena',1);unlock('Miguel');chapter(3)">[ O que você está escondendo? ]</button><button onclick="choice('helena',0);chapter(3)">[ Vou descobrir sozinha. ]</button>`;
if(name==="Caio")return `<button onclick="choice('caio',1);chapter(4)">[ O que aconteceu às 03:17? ]</button><button onclick="choice('caio',0);chapter(4)">[ Tudo bem. ]</button>`;
if(name==="Miguel")return `<button onclick="unlock('Daniel');chapter(5)">[ Abrir o arquivo 17-03-21-17 ]</button>`;
if(name==="Sofia")return `<button onclick="chapter(4);clue(3)">[ Me envie a captura. ]</button>`;
return "";
}
function advance(n,s){if(n==="Noah"&&s===4){clue(2)}}
function choice(k,v){S.choices[k]=v;save();toast("Escolha registrada.");}
function unlock(n){if(!S.contactsUnlocked.includes(n))S.contactsUnlocked.push(n);save();toast(`${n} adicionado aos contatos`)}
function clue(n){if(!S.clues.includes(n)){S.clues.push(n);save();beep("notify");toast("🔎 NOVA PISTA: "+clues[n][0])}}
function chapter(n){S.chapter=Math.max(S.chapter,n);save();setTimeout(()=>chapterScreen(n),500)}
function chapterScreen(n){clue(Math.min(n,10));render(`<div class="page" style="display:flex;min-height:100%;align-items:center;justify-content:center"><div style="text-align:center"><div class="muted">CAPÍTULO ${n}</div><h2>${["","O número desconhecido","Lívia","O grupo","A fotografia","17","A ligação","O lugar","O arquivo apagado","A verdade","Arquivo 17"][n]}</h2><p class="muted">Pistas encontradas: ${S.clues.length}<br>Mensagens recebidas: ${n*3}<br>Confiança: ${trust()}</p><button class="primary" onclick="${n===10?'ending()':'home()'}">CONTINUAR</button></div></div>`)}
function trust(){return (S.choices.trust?2:1)+(S.choices.helena?1:0)}
function investigation(){render(`<div class="page">${top("INVESTIGAÇÃO")}<div class="card"><b>CASO LÍVIA MORAES</b><p class="muted">Desaparecimento • status: ativo</p></div>${S.clues.map(n=>`<div class="card clue"><b>${clues[n][0]}</b><p class="muted">${clues[n][1]}</p></div>`).join("")||'<div class="card muted">Nenhuma pista encontrada ainda.</div>'}<div class="card"><b>LINHA DO TEMPO</b><p class="mono">23:17 — primeira mensagem<br>23:41 — chamada perdida<br>00:13 — arquivo recebido<br>01:07 — número desconhecido<br>02:17 — acesso ao ARQUIVO 17</p></div></div>`)}
function contacts(){render(`<div class="page">${top("Contatos")}<div class="list">${S.contactsUnlocked.map(n=>`<button onclick="chat('${n}',0)"><div class="row"><div class="avatar">${people[n].initial}</div><div><b>${n}</b><div class="muted">${people[n].number}</div></div></div></button>`).join("")}</div></div>`)}
function phone(){render(`<div class="page">${top("Telefone")}<div class="card"><b>CHAMADAS RECENTES</b><p class="muted">23:41 • PRIVADO • perdida</p><p class="muted">23:17 • NOAH • recebida</p><p class="muted">02:17 • +55 21 0000-0017 • perdida</p></div><button class="primary" onclick="incoming()">📞 Simular chamada recebida</button></div>`)}
function incoming(){beep("call");render(`<div class="call"><div class="bigavatar">?</div><div class="caller">NÚMERO DESCONHECIDO</div><div class="number">PRIVADO</div><div class="call-actions"><button onclick="answer()">ATENDER</button><button class="danger" onclick="phone();toast('Chamada recusada')">RECUSAR</button></div></div>`)}
function answer(){let t=0;render(`<div class="call"><div class="bigavatar">?</div><div class="caller">NÚMERO DESCONHECIDO</div><div class="timer" id="ct">00:00</div><div class="card"><b>VOZ DESCONHECIDA</b><p id="voice">"Você está sozinha?"</p></div><div class="choices"><button onclick="callReply('sim')">[ Sim ]</button><button onclick="callReply('nao')">[ Não ]</button><button onclick="callReply('quem')">[ Quem é você? ]</button></div></div>`);const iv=setInterval(()=>{t++;let x=document.getElementById("ct");if(x)x.textContent=`00:${String(t).padStart(2,"0")}`;if(t>17){clearInterval(iv)}},1000)}
function callReply(x){clue(6);document.getElementById("voice").textContent=x==="quem"?"Eu sou a parte que você ainda não encontrou.":"Então você já começou a mentir.";toast("A chamada terminou.");setTimeout(()=>investigation(),1300)}
function gallery(){render(`<div class="page">${top("Galeria")}<div class="photo">IMG_0017<br>porta / símbolo / 03:17</div><div class="photo">IMG_0009<br>grupo de amigos — arquivo corrompido</div><div class="photo">IMG_0031<br>corredor escuro — sem localização</div><button class="primary" onclick="clue(3);toast('Metadados recuperados: 03:17')">ANALISAR FOTOS</button></div>`)}
function files(){render(`<div class="page">${top("Arquivos")}<div class="list"><button onclick="file17()">📄 IMG_0017 <span class="badge">1.8 MB</span></button><button onclick="clue(8);toast('Arquivo corrompido parcialmente recuperado')">📁 deleted_messages.zip <span class="badge">corrompido</span></button><button onclick="chapter(8)">🎙️ voice_17.wav <span class="badge">0:17</span></button></div></div>`)}
function file17(){render(`<div class="page">${top("IMG_0017")}<div class="card mono">17 — 03 — 21 — 17</div><p class="muted">A sequência não é uma senha comum. Tente relacioná-la aos horários, às mensagens e ao grupo.</p><div class="choices"><button onclick="clue(5);toast('Senha aceita. Nota escondida desbloqueada.')">17 03 21 17</button><button onclick="toast('Senha incorreta')">03 17 17 21</button></div></div>`)}
function notes(){render(`<div class="page">${top("Notas")}<div class="card"><b>LÍVIA — rascunho</b><p>"Se alguma coisa acontecer, não procure uma pessoa. Procure o padrão."</p><p class="mono">17 aparece quando alguém está observando.</p></div><div class="card"><b>GIOVANNA — investigação</b><p class="muted">Noah, Helena, Caio, Miguel, Sofia, Daniel. Todos esconderam alguma coisa.</p></div></div>`)}
function browser(){render(`<div class="page">${top("Navegador")}<div class="card"><b>Pesquisa</b><p class="mono">observatorio_moraes / 17</p></div><div class="card"><b>RESULTADO ARQUIVADO</b><p class="muted">Antigo observatório municipal — fechado após um incêndio em 2017. Registros públicos incompletos.</p></div></div>`)}
